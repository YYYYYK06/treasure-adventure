<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秘宝奇航 · 寻宝冒险</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1330'/%3E%3Cpath d='M32 10l5.5 12.5L50 28l-12.5 5.5L32 46l-5.5-12.5L14 28l12.5-5.5z' fill='%23f2c14e'/%3E%3Ccircle cx='50' cy='16' r='4' fill='%238fd3f4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg-deep:#060a1c;
  --bg:#0b1330;
  --bg-soft:#131f4a;
  --bg-card:rgba(15,25,58,.82);
  --gold:#f2c14e;
  --gold-bright:#ffd97a;
  --gold-deep:#c98a2e;
  --moon:#8fd3f4;
  --teal:#5fb6c9;
  --text:#f4efe2;
  --text-dim:#aeb7d4;
  --danger:#e0714f;
  --ok:#7fd9a6;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg-deep);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  background-image:
    radial-gradient(1200px 600px at 15% -5%, rgba(46,72,148,.35), transparent 60%),
    radial-gradient(900px 500px at 85% 0%, rgba(30,58,110,.30), transparent 60%),
    linear-gradient(180deg,#0a1028 0%,#070b1e 55%,#05081a 100%);
}
::selection{background:rgba(242,193,78,.35)}

/* ===== 星空 ===== */
.stars{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,255,255,.8), transparent 55%),
    radial-gradient(1px 1px at 28% 12%, rgba(255,255,255,.6), transparent 55%),
    radial-gradient(1.5px 1.5px at 41% 31%, rgba(255,255,255,.7), transparent 55%),
    radial-gradient(1px 1px at 55% 16%, rgba(255,255,255,.5), transparent 55%),
    radial-gradient(2px 2px at 67% 26%, rgba(255,255,255,.75), transparent 55%),
    radial-gradient(1px 1px at 78% 11%, rgba(255,255,255,.55), transparent 55%),
    radial-gradient(1.5px 1.5px at 88% 24%, rgba(255,255,255,.7), transparent 55%),
    radial-gradient(1px 1px at 8% 48%, rgba(255,255,255,.5), transparent 55%),
    radial-gradient(1.5px 1.5px at 22% 60%, rgba(255,255,255,.6), transparent 55%),
    radial-gradient(1px 1px at 36% 44%, rgba(255,255,255,.45), transparent 55%),
    radial-gradient(1.5px 1.5px at 50% 55%, rgba(255,255,255,.6), transparent 55%),
    radial-gradient(1px 1px at 63% 48%, rgba(255,255,255,.5), transparent 55%),
    radial-gradient(2px 2px at 74% 58%, rgba(255,255,255,.65), transparent 55%),
    radial-gradient(1px 1px at 86% 40%, rgba(255,255,255,.5), transparent 55%),
    radial-gradient(1px 1px at 94% 52%, rgba(255,255,255,.55), transparent 55%),
    radial-gradient(1px 1px at 16% 78%, rgba(255,255,255,.45), transparent 55%),
    radial-gradient(1.5px 1.5px at 33% 84%, rgba(255,255,255,.55), transparent 55%),
    radial-gradient(1px 1px at 47% 74%, rgba(255,255,255,.45), transparent 55%),
    radial-gradient(1.5px 1.5px at 61% 86%, rgba(255,255,255,.6), transparent 55%),
    radial-gradient(1px 1px at 76% 72%, rgba(255,255,255,.5), transparent 55%),
    radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,.45), transparent 55%);
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}

/* ===== 版式 ===== */
.page{
  position:relative;z-index:1;
  max-width:1020px;margin:0 auto;padding:26px 18px 40px;
}
.top{text-align:center;margin-bottom:20px}
.badge{
  display:inline-block;font-size:13px;letter-spacing:.32em;color:var(--gold);
  border:1px solid rgba(242,193,78,.45);border-radius:999px;padding:6px 16px 6px 20px;
  margin-bottom:14px;background:rgba(242,193,78,.08);
}
.top h1{
  font-family:"Noto Serif SC",serif;font-weight:900;font-size:44px;letter-spacing:.14em;
  background:linear-gradient(180deg,#ffe9ad 0%,#f2c14e 55%,#c98a2e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 34px rgba(242,193,78,.22);
}
.sub{margin-top:10px;font-size:15px;color:var(--text-dim);letter-spacing:.06em}

/* ===== 舞台 ===== */
.stage-wrap{margin-top:8px}
.stage{
  position:relative;width:100%;height:min(520px,52vh);min-height:330px;
  border-radius:var(--radius);overflow:hidden;
  border:1px solid rgba(242,193,78,.28);
  box-shadow:0 18px 60px rgba(0,0,0,.55), inset 0 0 80px rgba(0,0,0,.4);
  background:var(--bg-soft);
  isolation:isolate;
}
.stage-bg{position:absolute;inset:0;z-index:0}
.stage-bg img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1.08);filter:saturate(.92);
  transition:opacity 1.1s ease, transform 7s linear;
}
.stage-bg img.on{opacity:1}
.stage-bg img.zoom{transform:scale(1.16)}
.stage-vignette{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  background:
    radial-gradient(115% 90% at 50% 42%, transparent 52%, rgba(4,7,20,.55) 100%),
    linear-gradient(180deg, rgba(4,7,20,.42) 0%, transparent 22%, transparent 78%, rgba(4,7,20,.5) 100%);
}
.fx{position:absolute;inset:0;z-index:2;pointer-events:none}

/* ===== 前景元素 ===== */
.stage-fg{position:absolute;inset:0;z-index:4;pointer-events:none}
.fg-item{position:absolute;opacity:0;transform:translateY(26px) scale(.92);transition:opacity .8s ease,transform .8s cubic-bezier(.22,1,.36,1)}
.fg-item.show{opacity:1;transform:translateY(0) scale(1)}
.fg-item.clickable{pointer-events:auto;cursor:pointer}
.fg-item.shake{animation:shake .5s}

/* 羊皮纸 */
.parchment{left:50%;top:16%;width:min(190px,30vw);transform:translateX(-50%)}
.parchment.show{transform:translateX(-50%) translateY(0) scale(1)}
.parchment svg{width:100%;display:block;filter:drop-shadow(0 10px 22px rgba(242,193,78,.35));animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1.2deg)}}

/* 符文圆环 */
.rune{left:50%;top:18%;width:min(210px,34vw);transform:translateX(-50%)}
.rune.show{transform:translateX(-50%) translateY(0) scale(1)}
.rune svg{width:100%;display:block;animation:spin 14s linear infinite;filter:drop-shadow(0 0 24px rgba(242,193,78,.5))}
@keyframes spin{to{transform:rotate(360deg)}}

/* 提灯 */
.lantern{left:50%;top:auto;bottom:10%;width:min(120px,22vw);transform:translateX(-50%)}
.lantern.show{transform:translateX(-50%) translateY(0) scale(1)}
.lantern svg{width:100%;display:block;animation:sway 3s ease-in-out infinite;transform-origin:top center;filter:drop-shadow(0 0 30px rgba(255,217,122,.55))}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* 星盘 */
.astrolabe{left:50%;top:16%;width:min(230px,38vw);transform:translateX(-50%)}
.astrolabe.show{transform:translateX(-50%) translateY(0) scale(1)}
.astrolabe svg{width:100%;display:block;animation:astroPulse 3.2s ease-in-out infinite}
@keyframes astroPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.astrolabe .star-dot{transition:r .2s ease, fill .2s ease;cursor:pointer}
.astrolabe .star-dot:hover{fill:#ffe9ad}

/* 宝箱 */
.chest{left:50%;top:auto;bottom:8%;width:min(170px,30vw);transform:translateX(-50%)}
.chest.show{transform:translateX(-50%) translateY(0) scale(1)}
.chest svg{width:100%;display:block;filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))}

/* 萤火虫收集目标 */
.firefly-target{position:absolute;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer}
.firefly-target .dot{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff8dc 0%,#ffd97a 45%,rgba(242,193,78,.15) 75%);box-shadow:0 0 24px 8px rgba(255,217,122,.55);animation:ffPulse 1.6s ease-in-out infinite}
.firefly-target.caught .dot{animation:none;opacity:0;transform:scale(.3)}
@keyframes ffPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.firefly-target{transition:left 3.2s ease-in-out,top 3.2s ease-in-out}

/* 守卫谜题面板 */
.quiz{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(430px,88%);z-index:6;pointer-events:auto;
  background:var(--bg-card);border:1px solid rgba(242,193,78,.4);border-radius:16px;
  padding:20px 22px;backdrop-filter:blur(6px);
  box-shadow:0 18px 50px rgba(0,0,0,.6);
  text-align:center;opacity:0;transition:opacity .5s ease,transform .5s cubic-bezier(.22,1,.36,1);
}
.quiz.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.quiz h3{font-family:"Noto Serif SC",serif;font-size:19px;color:var(--gold);letter-spacing:.08em;margin-bottom:8px}
.quiz p{font-size:14.5px;line-height:1.75;color:var(--text-dim);margin-bottom:16px}
.quiz .opts{display:flex;flex-direction:column;gap:10px}
.quiz button{
  font-family:inherit;font-size:15px;color:var(--text);background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 16px;cursor:pointer;
  transition:border-color .2s,background .2s,transform .15s;
  min-height:46px;text-align:left;
}
.quiz button:hover{border-color:var(--gold);background:rgba(242,193,78,.12)}
.quiz button:active{transform:scale(.98)}
.quiz button.wrong{border-color:var(--danger);background:rgba(224,113,79,.16);animation:shake .4s}
.quiz button.right{border-color:var(--ok);background:rgba(127,217,166,.18)}
.quiz button:disabled{cursor:default;opacity:.75}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ===== 角色 ===== */
.hero{
  position:absolute;z-index:5;left:50%;bottom:3%;width:56px;height:92px;
  transform:translateX(-50%);pointer-events:none;
  opacity:0;transition:opacity .8s ease;
}
.hero.on{opacity:1}
.hero svg{width:100%;height:100%;display:block}
.hero.walk{animation:heroWalk 1.4s ease-in-out infinite}
@keyframes heroWalk{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
.hero.jump{animation:heroJump 1s cubic-bezier(.22,1,.36,1)}
@keyframes heroJump{0%{transform:translateY(0)}40%{transform:translateY(-34px)}100%{transform:translateY(0)}}
.hero.hop{animation:heroHop .5s ease-in-out}
@keyframes heroHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* ===== 进度轨道 ===== */
.progress{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin:20px 4px 6px;position:relative;
}
.progress::before{
  content:"";position:absolute;left:4%;right:4%;top:15px;height:2px;
  background:rgba(255,255,255,.12);border-radius:2px;
}
.progress::after{
  content:"";position:absolute;left:4%;top:15px;height:2px;width:var(--fill,0%);
  background:linear-gradient(90deg,var(--gold-deep),var(--gold-bright));
  border-radius:2px;transition:width .9s ease;box-shadow:0 0 12px rgba(242,193,78,.6);
}
.p-node{
  position:relative;z-index:1;flex:0 0 auto;width:46px;display:flex;flex-direction:column;align-items:center;gap:7px;
}
.p-dot{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--text-dim);
  background:var(--bg-soft);border:2px solid rgba(255,255,255,.18);
  transition:all .4s ease;font-family:"Noto Serif SC",serif;
}
.p-label{font-size:11.5px;color:var(--text-dim);letter-spacing:.04em;white-space:nowrap;transition:color .4s}
.p-node.done .p-dot{background:linear-gradient(160deg,var(--gold-bright),var(--gold-deep));color:#3a2a05;border-color:var(--gold);box-shadow:0 0 16px rgba(242,193,78,.55)}
.p-node.done .p-label{color:var(--gold)}
.p-node.cur .p-dot{border-color:var(--gold-bright);color:var(--gold-bright);box-shadow:0 0 0 0 rgba(255,217,122,.5);animation:pulse 1.4s infinite}
.p-node.cur .p-label{color:var(--gold-bright)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,217,122,.5)}70%{box-shadow:0 0 0 12px rgba(255,217,122,0)}100%{box-shadow:0 0 0 0 rgba(255,217,122,0)}}

/* ===== 控制台 ===== */
.console{
  margin-top:14px;background:var(--bg-card);border:1px solid rgba(255,255,255,.1);
  border-radius:var(--radius);padding:18px 20px;min-height:132px;
  display:flex;flex-direction:column;justify-content:center;position:relative;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}
.msg-line{font-size:15.5px;line-height:1.85;color:var(--text);letter-spacing:.03em;min-height:1.85em}
.msg-line .gold{color:var(--gold);font-weight:700}
.msg-line .teal{color:var(--moon)}
.msg-line .danger{color:var(--danger)}
.msg-line{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
.msg-line.show{opacity:1;transform:translateY(0)}
.actions{margin-top:14px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn-primary{
  font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;letter-spacing:.2em;
  color:#3a2a05;padding:13px 38px;border:none;border-radius:999px;cursor:pointer;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold-deep));
  box-shadow:0 8px 26px rgba(242,193,78,.35);transition:transform .15s,box-shadow .2s,filter .2s;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(242,193,78,.5);filter:brightness(1.05)}
.btn-primary:active{transform:translateY(0) scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;filter:grayscale(.4)}
.btn-ghost{
  font-family:inherit;font-size:14px;color:var(--text-dim);padding:11px 24px;border-radius:999px;cursor:pointer;
  background:transparent;border:1px solid rgba(255,255,255,.22);transition:border-color .2s,color .2s;min-height:44px;
}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

/* ===== 成就卡 ===== */
.trophy{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);z-index:7;
  width:min(360px,90%);text-align:center;opacity:0;pointer-events:none;
  background:linear-gradient(160deg,rgba(32,24,8,.94),rgba(18,12,4,.94));
  border:2px solid var(--gold);border-radius:20px;padding:28px 26px;
  box-shadow:0 0 60px rgba(242,193,78,.5), 0 22px 60px rgba(0,0,0,.6);
  transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1);
}
.trophy.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.trophy .gem{width:74px;height:74px;margin:0 auto 12px;animation:gemSpin 3.4s ease-in-out infinite}
@keyframes gemSpin{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.08)}}
.trophy h2{font-family:"Noto Serif SC",serif;font-size:26px;letter-spacing:.12em;color:var(--gold-bright);margin-bottom:8px}
.trophy p{font-size:14px;color:#e8dcc0;line-height:1.8}
.trophy .title-gain{margin-top:14px;font-size:14px;color:var(--moon);letter-spacing:.2em}

.foot{text-align:center;margin-top:22px;font-size:12.5px;color:rgba(174,183,212,.55);letter-spacing:.1em}

/* ===== 响应式 ===== */
@media (max-width:560px){
  .page{padding:18px 12px 30px}
  .top h1{font-size:32px}
  .sub{font-size:13px;line-height:1.7}
  .stage{height:min(400px,44vh);min-height:280px}
  .p-node{width:auto;flex:1}
  .p-dot{width:26px;height:26px;font-size:11px}
  .p-label{font-size:10px}
  .console{padding:14px}
  .msg-line{font-size:14px}
  .hero{width:46px;height:76px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .stars{animation:none}
}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>

<div class="page">
  <header class="top">
    <div class="badge">月下探险 · 星月神庙</div>
    <h1>秘宝奇航</h1>
    <p class="sub">传说「智慧之心」沉睡在星月神庙深处，勇敢的探险家，出发吧</p>
  </header>

  <main class="stage-wrap">
    <div class="stage" id="stage">
      <div class="stage-bg" id="stageBg">
        <img src="assets/scene-library.jpg" data-scene="library" alt="古老图书馆场景">
        <img src="assets/scene-forest.jpg" data-scene="forest" alt="迷雾森林场景">
        <img src="assets/scene-gate.jpg" data-scene="gate" alt="神庙石门场景">
        <img src="assets/scene-guard.jpg" data-scene="guard" alt="守卫大厅场景">
        <img src="assets/scene-chest.jpg" data-scene="chest" alt="月光宝箱场景">
      </div>
      <canvas class="fx" id="fx"></canvas>
      <div class="stage-vignette" aria-hidden="true"></div>
      <div class="stage-fg" id="stageFg"></div>
      <div class="hero" id="hero">
        <svg viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M60 8 L66 30 L54 30 Z" fill="#7a5a3a"/>
          <path d="M52 32 Q60 26 68 32 L92 120 Q60 138 28 120 Z" fill="#4a6fa5"/>
          <path d="M52 32 Q60 26 68 32 L64 92 Q60 96 56 92 Z" fill="#3b5c8c"/>
          <circle cx="60" cy="48" r="15" fill="#f0c9a0"/>
          <circle cx="60" cy="48" r="15" fill="none" stroke="#8a6a48" stroke-width="2"/>
          <path d="M56 52 Q60 56 64 52" stroke="#8a6a48" stroke-width="2" fill="none"/>
          <rect x="53" y="116" width="14" height="42" rx="7" fill="#33415c"/>
          <rect x="38" y="120" width="44" height="12" rx="6" fill="#2b3550"/>
          <path d="M28 116 L38 126 L38 138 L28 128 Z" fill="#6b4a2a"/>
          <path d="M92 116 L82 126 L82 138 L92 128 Z" fill="#6b4a2a"/>
          <g class="lantern-hand" fill="none" stroke="#3a2a10" stroke-width="3">
            <path d="M96 96 L108 88"/>
          </g>
          <circle cx="111" cy="84" r="9" fill="#ffd97a">
            <animate attributeName="opacity" values=".85;1;.85" dur="1.6s" repeatCount="indefinite"/>
          </circle>
          <circle cx="111" cy="84" r="14" fill="rgba(255,217,122,.22)">
            <animate attributeName="r" values="11;17;11" dur="1.6s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
      <div class="trophy" id="trophy">
        <svg class="gem" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <polygon points="50,6 88,34 78,88 22,88 12,34" fill="#f2c14e"/>
          <polygon points="50,6 50,42 12,34" fill="#ffd97a" opacity=".7"/>
          <polygon points="50,42 88,34 50,70" fill="#c98a2e" opacity=".85"/>
          <polygon points="22,88 78,88 50,70" fill="#e8a33d"/>
          <polygon points="12,34 50,42 22,88" fill="#b97f26"/>
          <circle cx="42" cy="30" r="4" fill="#fff8dc" opacity=".9"/>
        </svg>
        <h2>智慧之心</h2>
        <p>你穿越森林、破解机关、答对守卫的谜题，终于捧起了传说中的宝藏。</p>
        <div class="title-gain">获得称号：传奇寻宝者</div>
      </div>
    </div>

    <div class="progress" id="progress" role="group" aria-label="寻宝进度"></div>

    <div class="console">
      <div class="msg-line" id="msg"></div>
      <div class="actions" id="actions">
        <button class="btn-primary" id="btnStart">开始寻宝</button>
      </div>
    </div>
  </main>

  <footer class="foot">星盘机关与守卫谜题需要你的选择 · 找到智慧之心即可获得称号</footer>
</div>

<script>
"use strict";

/* ============================================================
 * 一、模拟宝藏地图 API —— 保留原 TreasureMap 的 Promise 风格，
 *     并新增更有趣的寻宝情节（迷雾森林 / 星盘机关 / 守卫谜题）
 * ============================================================ */
const wait = (ms, val) => new Promise(res => setTimeout(() => res(val), ms));
const delay = (ms) => new Promise(res => setTimeout(res, ms));

class TreasureMap {
  static getInitialClue() {
    return wait(1200, "在古老的图书馆深处，一本会发光的书引你找到一张泛黄的羊皮纸：\n「月升之时，穿过萤火虫守护的森林，宝藏沉睡在星盘之后。」");

  }
  static crossMistyForest() {
    return wait(1600, "迷雾森林里萤火虫如星尘飞舞。提灯亮起，萤火虫们排成一条金色的路，为你引向神庙。");
  }

    return wait(1400, "石门轰然开启，一条长廊通向神庙深处，石像守卫正静静伫立。");
  }

  }

  }
}

/* ============================================================
 * 二、阶段数据
 * ============================================================ */
const STAGES = [
  { id:"library", name:"启程", scene:"library" },
  { id:"decode",  name:"破译", scene:"library" },
  { id:"forest",  name:"穿越", scene:"forest"  },
  { id:"gate",    name:"解谜", scene:"gate"    },
  { id:"guard",   name:"试炼", scene:"guard"   },
  { id:"seek",    name:"寻觅", scene:"chest"   },
  { id:"open",    name:"开启", scene:"chest"   },
  { id:"final",   name:"终章", scene:"chest"   }
];

/* ============================================================
 * 三、DOM 引用与状态
 * ============================================================ */
const $ = (id) => document.getElementById(id);
const stage = $("stage"), stageBg = $("stageBg"), stageFg = $("stageFg");
const hero = $("hero"), msg = $("msg"), actions = $("actions");
const btnStart = $("btnStart"), trophy = $("trophy"), fxCanvas = $("fx");
const fxCtx = fxCanvas.getContext("2d");

let running = false;
let curIdx = -1;

/* ============================================================
 * 四、工具：消息 / 进度 / 场景切换
 * ============================================================ */
function setMsg(text, cls) {
  msg.classList.remove("show");
  setTimeout(() => {
    msg.innerHTML = "";
    const lines = text.split("\n");
    lines.forEach((ln, i) => {
      if (i > 0) msg.appendChild(document.createElement("br"));
      msg.appendChild(document.createTextNode(ln));
    });
    msg.className = "msg-line show" + (cls ? " " + cls : "");
  }, 220);
}

function buildProgress() {
  const p = $("progress");
  p.innerHTML = "";
  STAGES.forEach((s, i) => {
    const node = document.createElement("div");
    node.className = "p-node";
    node.innerHTML = `<div class="p-dot">${i + 1}</div><div class="p-label">${s.name}</div>`;
    node.dataset.idx = i;
    p.appendChild(node);
  });
}
function updateProgress(i) {
  const nodes = document.querySelectorAll(".p-node");
  nodes.forEach((n, k) => {
    n.classList.toggle("done", k < i);
    n.classList.toggle("cur", k === i);
  });
  const ratio = i >= STAGES.length - 1 ? 92 : (i / (STAGES.length - 1)) * 92;
  document.querySelector(".progress").style.setProperty("--fill", ratio + "%");
}

function switchScene(idx) {
  const st = STAGES[idx];
  stageBg.querySelectorAll("img").forEach(im => im.classList.remove("on", "zoom"));
  const img = stageBg.querySelector('img[data-scene="' + st.scene + '"]');
  if (img) {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { img.classList.add("on", "zoom"); });
    });
  }
  stageFg.innerHTML = "";
  curIdx = idx;
  updateProgress(idx);
}

/* 向舞台添加前景 SVG 元素 */
function fgItem(html, cls, pos) {
  const el = document.createElement("div");
  el.className = "fg-item " + cls;
  el.style.left = pos.left; el.style.top = pos.top;
  el.style.transform = pos.transform || "";
  el.innerHTML = html;
  stageFg.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
  return el;
}

/* ============================================================
 * 六、粒子系统（Canvas）
 * ============================================================ */
let particles = [];
let fxMode = "none";
let fxStart = 0;

function setFx(mode) {
  fxMode = mode;
  particles = [];
  fxStart = performance.now();
  const w = fxCanvas.width, h = fxCanvas.height;
  if (mode === "fireflies") {
    for (let i = 0; i < 24; i++) particles.push({
      type:"ff", baseX: Math.random()*w, baseY: Math.random()*h,
      r: 2 + Math.random()*3, speed: .02 + Math.random()*.05,
      amp: 18 + Math.random()*46, phase: Math.random()*6.28, tw: Math.random()*6.28
    });
  } else if (mode === "moonlight") {
    for (let i = 0; i < 28; i++) particles.push({
      type:"dust", x: Math.random()*w, y: h*.3 + Math.random()*h*.7,
      vy: .2 + Math.random()*.4, r: 1.5 + Math.random()*2.5,
      a: .18 + Math.random()*.3, phase: Math.random()*6.28
    });
  } else if (mode === "goldburst") {
    for (let i = 0; i < 90; i++) {
      const ang = -Math.PI/2 + (Math.random()-.5)*2.6;
      const sp = 3 + Math.random()*8;
      particles.push({ type:"burst", x: w/2, y: h*.8,
        vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
        r: 2.5 + Math.random()*4.5, life: 1, lifeV: .006 + Math.random()*.012 });
    }
  } else if (mode === "rain") {
    for (let i = 0; i < 48; i++) particles.push({
      type:"rain", x: Math.random()*w, y: -14 - Math.random()*80,
      vy: 1.1 + Math.random()*1.9, r: 1.8 + Math.random()*3.2, tw: Math.random()*6.28
    });
  }
}

function drawGlow(x, y, r, rgb, a) {
  const c = fxCtx;
  c.beginPath();
  c.fillStyle = "rgba(" + rgb + "," + a + ")";
  c.arc(x, y, r, 0, Math.PI*2);
  c.fill();
  c.beginPath();
  c.fillStyle = "rgba(" + rgb + "," + (a*.22) + ")";
  c.arc(x, y, r*2.8, 0, Math.PI*2);
  c.fill();
}

function fxLoop(now) {
  const w = fxCanvas.width, h = fxCanvas.height;
  fxCtx.clearRect(0, 0, w, h);
  if (fxMode !== "none") {
    if (fxMode === "fireflies") {
      if (particles.length < 24) particles.push({
        type:"ff", baseX: Math.random()*w, baseY: Math.random()*h,
        r: 2 + Math.random()*3, speed: .02 + Math.random()*.05,
        amp: 18 + Math.random()*46, phase: Math.random()*6.28, tw: Math.random()*6.28
      });
      particles.forEach(p => {
        p.phase += p.speed;
        const x = p.baseX + Math.sin(p.phase)*p.amp;
        const y = p.baseY + Math.cos(p.phase*.8)*p.amp*.5;
        const a = .3 + .6*(0.5 + 0.5*Math.sin(now*.002 + p.tw));
        drawGlow(x, y, p.r, "255,217,122", a);
      });
    } else if (fxMode === "moonlight") {
      particles.forEach(p => {
        p.y -= p.vy;
        p.phase += .03;
        if (p.y < -8) { p.y = h + 8; p.x = Math.random()*w; }
        drawGlow(p.x + Math.sin(p.phase)*9, p.y, p.r, "143,211,244", p.a);
      });
    } else if (fxMode === "goldburst") {
      particles.forEach(p => {
        p.vy += .12;
        p.x += p.vx; p.y += p.vy;
        p.life -= p.lifeV;
        if (p.life > 0) drawGlow(p.x, p.y, p.r*Math.max(.3,p.life), "255,217,122", Math.min(1, p.life*1.6));
      });
      particles = particles.filter(p => p.life > 0);
      if (particles.length === 0) setFx("rain");
    } else if (fxMode === "rain") {
      particles.forEach(p => {
        p.y += p.vy;
        p.x += Math.sin(now*.001 + p.tw)*.5;
        p.tw += .01;
        if (p.y > h + 12) { p.y = -12; p.x = Math.random()*w; }
        const a = .4 + .5*(0.5 + 0.5*Math.sin(now*.004 + p.tw));
        drawGlow(p.x, p.y, p.r, "255,217,122", a);
      });
    }
  }
  requestAnimationFrame(fxLoop);
}

function resizeFx() {
  fxCanvas.width = stage.clientWidth * devicePixelRatio;
  fxCanvas.height = stage.clientHeight * devicePixelRatio;
  if (fxMode !== "none") setFx(fxMode);
}

/* ============================================================
 * 七、交互：收集萤火虫 / 星盘机关 / 守卫谜题
 * ============================================================ */
function collectFireflies() {
  return new Promise((resolve) => {
    let caught = 0;
    const total = 3;
    setFx("fireflies");
    fgItem(SVG.lantern, "lantern", {left:"50%", top:"auto", transform:"translateX(-50%)"}).style.bottom = "12%";
    setMsg("迷雾森林中，萤火虫如星尘飞舞。点击收集 3 只萤火虫点亮提灯，它们会为你引路。", "teal");
    const spawn = () => {
      if (caught >= total) return;
      const t = document.createElement("div");
      t.className = "firefly-target";
      const dot = document.createElement("div");
      dot.className = "dot";
      t.appendChild(dot);
      t.style.left = (14 + Math.random()*64) + "%";
      t.style.top = (16 + Math.random()*48) + "%";
      stageFg.appendChild(t);
      const move = () => {
        if (!t.isConnected) return;
        t.style.left = (14 + Math.random()*64) + "%";
        t.style.top = (16 + Math.random()*48) + "%";
      };
      t._timer = setInterval(move, 1700);
      t.addEventListener("click", () => {
        clearInterval(t._timer);
        t.classList.add("caught");
        setTimeout(() => t.remove(), 420);
        caught++;
        if (caught >= total) {
          setTimeout(() => resolve(), 600);
        } else {
          spawn();
        }
      });
    };
    spawn(); spawn(); spawn();
  });
}

function solveAstrolabe() {
  return new Promise((resolve) => {
    const order = ["left", "top", "right"];
    let step = 0;
    setFx("moonlight");
    setMsg("神庙石门刻着星盘机关，三颗星辰需要按顺序点亮：左角之星、顶冠之星、右翼之星。", "teal");
    const el = fgItem(SVG.astrolabe, "astrolabe clickable", {left:"50%", top:"16%", transform:"translateX(-50%)"});
    el.querySelectorAll(".star-dot").forEach(d => {
      d.addEventListener("click", () => {
        if (d.dataset.done) return;
        if (d.dataset.key === order[step]) {
          d.dataset.done = "1";
          d.setAttribute("fill", "#f2c14e");
          d.setAttribute("opacity", "1");
          step++;
          hero.classList.remove("hop"); void hero.offsetWidth; hero.classList.add("hop");
          if (step >= order.length) {
            el.style.opacity = ".55";
            setTimeout(resolve, 750);
          }
        } else {
          el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
          setMsg("星盘发出嗡鸣——顺序不对。再试一次：左角之星、顶冠之星、右翼之星。", "danger");
        }
      });
    });
  });
}

function answerRiddle() {
  return new Promise((resolve) => {
    setFx("moonlight");
    setMsg("石像守卫缓缓苏醒，低沉的声音在长廊中回荡：「回答我的谜题，否则……沉睡于此。」", "danger");
    const q = document.createElement("div");
    q.className = "quiz";
    q.innerHTML = '<h3>守卫的谜题</h3>' +
      '<p>「我从不开口，却能传遍四海；<br>我越被分享，就越丰盈。我是什么？」</p>' +
      '<div class="opts">' +
      '<button data-ans="a">A · 宝藏</button>' +
      '<button data-ans="b">B · 知识</button>' +
      '<button data-ans="c">C · 火焰</button>' +
      '</div>';
    stage.appendChild(q);
    requestAnimationFrame(() => q.classList.add("show"));
    const buttons = q.querySelectorAll("button");
    buttons.forEach(b => {
      b.addEventListener("click", () => {
        if (b.disabled) return;
        if (b.dataset.ans === "b") {
          b.classList.add("right"); b.disabled = true;
          buttons.forEach(x => { if (x !== b) x.disabled = true; });
          setMsg("守卫眼中蓝光一暗：「回答正确……智慧胜过一切财宝。过去吧，有缘人。」", "teal");
          setTimeout(() => {
            q.classList.remove("show");
            setTimeout(() => q.remove(), 450);
            resolve();
          }, 1300);
        } else {
          b.classList.add("wrong");
          setTimeout(() => b.classList.remove("wrong"), 520);
          setMsg("守卫摇头：「不对。再想想——什么是越分享越多？」", "danger");
        }
      });
    });
  });
}

/* ============================================================
 * 八、主流程 —— 用 async/await 重写的寻宝过程
 * ============================================================ */
async function findTreasure() {
  running = true;
  btnStart.disabled = true;
  actions.innerHTML = "";
  trophy.classList.remove("show");
  setFx("none");

  try {
    /* 第 1 站：启程 · 古老图书馆 */
    switchScene(0);
    hero.classList.add("on");
    setMsg("深夜的图书馆里，尘埃在月光中浮动，书架深处似乎有什么在发光……");
    const clue = await TreasureMap.getInitialClue();
    setMsg(clue, "gold");
    fgItem(SVG.parchment, "parchment", {left:"50%", top:"16%", transform:"translateX(-50%)"});
    await delay(2800);

    /* 第 2 站：破译 · 上古符文 */
    switchScene(1);
    setMsg("你靠近烛火，指尖抚过羊皮纸，上古符文开始缓缓发光……");
    const location = await TreasureMap.decodeAncientScript(clue);
    setMsg(location, "gold");
    fgItem(SVG.rune, "rune", {left:"50%", top:"18%", transform:"translateX(-50%)"});
    await delay(2900);

    /* 第 3 站：穿越 · 迷雾森林（点击收集萤火虫） */
    switchScene(2);
    hero.classList.add("walk");
    setMsg("你踏入迷雾森林，雾气翻涌，远处传来窸窣声响，萤火虫的光芒若隐若现……");
    await delay(1800);
    await collectFireflies();
    const forest = await TreasureMap.crossMistyForest();
    setMsg(forest, "teal");
    hero.classList.remove("walk");
    await delay(2600);

    /* 第 4 站：解谜 · 星盘石门（按顺序点亮星辰） */
    switchScene(3);
    setMsg("神庙石门矗立眼前，门中央的星盘机关泛着幽蓝星光，三颗星辰等待被唤醒……");
    await delay(1900);
    await solveAstrolabe();
    const gate = await TreasureMap.solveStarGate();
    setMsg(gate, "gold");
    await delay(2500);

    /* 第 5 站：试炼 · 神庙守卫（猜谜互动） */
    switchScene(4);
    setMsg("你走进幽深长廊，一尊巨大的石像守卫伫立中央，长矛折射着月光……");
    await delay(1900);
    await TreasureMap.askGuardRiddle();
    await answerRiddle();
    await delay(1500);

    /* 第 6 站：寻觅 · 月光密室 */
    switchScene(5);
    setMsg("你推开最后的石门，密室内月光如纱，石台上似乎放着一只箱子……");
    const box = await TreasureMap.searchTemple();
    setMsg(box, "teal");
    fgItem(SVG.chestClosed, "chest", {left:"50%", top:"auto", transform:"translateX(-50%)"});
    await delay(2900);

    /* 第 7 站：开启 · 月光宝箱 */
    switchScene(6);
    setMsg("月光钥匙已就位，你深吸一口气，缓缓转动……");
    const treasure = await TreasureMap.openTreasureBox();
    setMsg(treasure, "gold");
    hero.classList.remove("jump"); void hero.offsetWidth; hero.classList.add("jump");
    setFx("goldburst");
    stageFg.innerHTML = "";
    fgItem(SVG.chestOpen, "chest", {left:"50%", top:"auto", transform:"translateX(-50%)"});
    await delay(3200);

    /* 第 8 站：终章 · 智慧之心 */
    switchScene(7);
    setMsg("金色光雨洒落，传说中的智慧之心缓缓升起……");
    const finalMsg = await TreasureMap.claimTreasure();
    setMsg(finalMsg, "gold");
    setFx("rain");
    hero.classList.remove("jump"); void hero.offsetWidth; hero.classList.add("jump");
    await delay(1400);
    trophy.classList.add("show");
    await delay(3800);
  } catch (err) {
    setMsg("任务失败：" + err, "danger");
  } finally {
    running = false;
    setFx("rain");
    actions.innerHTML = '<button class="btn-primary" id="btnAgain">再次寻宝</button>';
    $("btnAgain").addEventListener("click", () => {
      setFx("none");
      trophy.classList.remove("show");
      stageFg.innerHTML = "";
      document.querySelectorAll(".quiz").forEach(x => x.remove());
      actions.innerHTML = "";
      findTreasure();
    });
  }
}

/* ============================================================
 * 九、初始化
 * ============================================================ */
function init() {
  buildProgress();
  updateProgress(0);
  const first = stageBg.querySelector('img[data-scene="library"]');
  if (first) first.classList.add("on", "zoom");
  resizeFx();
  window.addEventListener("resize", resizeFx);
  requestAnimationFrame(fxLoop);
  btnStart.addEventListener("click", findTreasure);
  if (new URLSearchParams(location.search).get("autoplay") === "1") autoPlay();
}

/* 自动通关（?autoplay=1 时启用，用于演示与自动化验证） */
async function autoPlay() {
  const fire = (el) => el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window }));
  const waitFor = async (fn, timeout) => {
    const t0 = Date.now(), limit = timeout || 40000;
    while (Date.now() - t0 < limit) {
      try { const v = fn(); if (v) return v; } catch (e) {}
      await wait(120);
    }
    return null;
  };
  await wait(300);
  fire(btnStart);
  await wait(500);
  for (let i = 0; i < 3; i++) {
    const t = await waitFor(() => document.querySelector(".firefly-target:not(.caught)"));
    if (!t) break;
    fire(t);
    await wait(400);
  }
  await waitFor(() => document.querySelector(".star-dot"));
  for (const key of ["left", "top", "right"]) {
    const d = await waitFor(() => document.querySelector('.star-dot[data-key="' + key + '"]:not([data-done])'));
    if (!d) break;
    fire(d);
    await wait(400);
  }
  const quiz = await waitFor(() => document.querySelector(".quiz"));
  if (quiz) {
    await wait(300);
    const rb = quiz.querySelector('button[data-ans="b"]');
    if (rb) fire(rb);
  }
}
document.addEventListener("DOMContentLoaded", init);
</script>
